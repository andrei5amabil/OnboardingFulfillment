[project]
name = "proiect"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Popescu", email = "andrei69420@yahoo.com" }
]
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi[standard]>=0.141.1",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.11",
    "ollama>=0.6.2",
    "pymupdf>=1.28.2",
    "pytesseract>=0.3.13",
    "python-dotenv>=1.2.2",
    "rank-bm25>=0.2.2",
    "requests>=2.34.2",
    "sentence-transformers>=6.0.1",
    "streamlit>=1.61.1",
    "supabase>=2.31.0",
    "tesseract>=0.1.3",
]

[project.scripts]
proiect = "proiect:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
